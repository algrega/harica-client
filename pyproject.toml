[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harica-client"
version = "0.12.0"
description = "Cautious CLI client for the HARICA Certificate Manager APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlGrega" }]
keywords = ["harica", "certificate-manager", "pki", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/algrega/harica-client"
Issues = "https://github.com/algrega/harica-client/issues"

[project.scripts]
harica-client = "harica_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
