name: "Question or support / Domanda o supporto"
description: "Ask about usage or documentation / Chiedi chiarimenti su utilizzo o documentazione"
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial project and cannot provide HARICA account support. Never include API keys, certificate contents, private hostnames, email addresses, cache files, exports, or unsanitized logs.

        Questo è un progetto non ufficiale e non può fornire assistenza sugli account HARICA. Non includere API key, contenuti di certificati, hostname privati, indirizzi email, cache, esportazioni o log non ripuliti.
  - type: checkboxes
    id: safety
    attributes:
      label: "Safety confirmation / Conferma di sicurezza"
      options:
        - label: "I checked the docs and issues and removed credentials or sensitive data. / Ho consultato documentazione e issue e rimosso credenziali o dati sensibili."
          required: true
  - type: input
    id: version
    attributes:
      label: "Version or commit / Versione o commit"
      description: "Paste the output of harica-client version or a full commit SHA. / Incolla l'output di harica-client version o uno SHA completo."
      placeholder: "version output / SHA completo"
    validations:
      required: true
  - type: dropdown
    id: python_version
    attributes:
      label: "Python version / Versione Python"
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "Other / Altro"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: "Operating system / Sistema operativo"
      placeholder: "Windows 11 x64, macOS 15, Ubuntu 24.04, FreeBSD 14..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "What did you try? / Cosa hai provato?"
      description: "List sanitized commands, Python calls, and documentation sections consulted."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Current result or understanding / Risultato o comprensione attuale"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result or clarification / Risultato o chiarimento atteso"
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional context / Informazioni aggiuntive"
